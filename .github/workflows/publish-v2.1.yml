name: Publish v2.1

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v2.1.yml]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.1
          fetch-depth: 0
          persist-credentials: false
      - name: Check artifacts match the tag
        run: >-
          test "$(git rev-parse HEAD)" =
          "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/46057044805" --jq .head_sha)"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46057044805
          pattern: '*-defender'
          path: dist
          merge-multiple: true
      - name: Publish release
        run: >-
          gh release create v2.1
          dist/disable-defender.exe dist/enable-defender.exe
          --verify-tag --notes-from-tag --title "Defender Control v2.1"
