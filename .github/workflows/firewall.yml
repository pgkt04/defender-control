name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  firewall-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check firewall changes are opt-in
        run: >-
          pipx run --spec semgrep==1.187.0 semgrep scan
          --metrics=off --disable-version-check --strict --error
          --config .github/firewall-policy.yml src/defender-control

  windows-build:
    name: Windows x64 (${{ matrix.mode }})
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: DEFENDER_ENABLE
            binary: enable-defender
          - mode: DEFENDER_DISABLE
            binary: disable-defender
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v3
      - name: Compile and link
        run: >-
          msbuild src/defender-control/defender-control.vcxproj
          -p:Configuration=Release -p:Platform=x64 -p:DefenderConfig=${{ matrix.mode }}
          -p:OutDir=${{ github.workspace }}/dist/ -p:TargetName=${{ matrix.binary }}
          -verbosity:minimal
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}.exe
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firewall-policy, windows-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-defender'
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/disable-defender.exe dist/enable-defender.exe
          --repo "$GITHUB_REPOSITORY" --verify-tag --notes-from-tag
          --title "Defender Control $GITHUB_REF_NAME"
